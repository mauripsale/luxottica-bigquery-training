steps:
  # =========================================================================
  # STEP 1: Build Docker image with Standard Docker (No Kaniko)
  # =========================================================================
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/training-hub/training-hub-app:$BUILD_ID'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/training-hub/training-hub-app:latest'
      - '-f'
      - 'v2/backend/Dockerfile'
      - 'v2'

  # =========================================================================
  # STEP 2: Push Docker image to Artifact Registry
  # =========================================================================
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/training-hub/training-hub-app'

  # =========================================================================
  # STEP 3: Deploy container to Google Cloud Run (Serverless Scale-to-Zero)
  # =========================================================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'luxottica-training-hub'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/training-hub/training-hub-app:$BUILD_ID'
      - '--region=us-central1'
      - '--platform=managed'
      - '--service-account=training-hub-backend-sa@$PROJECT_ID.iam.gserviceaccount.com'
      - '--allow-unauthenticated'
      - '--min-instances=0'
      - '--max-instances=5'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--set-env-vars=GCP_PROJECT_ID=$PROJECT_ID,BQ_DATASET_ID=luxottica_marketing_analytics,FRONTEND_DIR=/app/frontend'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/training-hub/training-hub-app:$BUILD_ID'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/training-hub/training-hub-app:latest'

timeout: '900s'

