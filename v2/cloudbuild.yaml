steps:
  # =========================================================================
  # STEP 1: Build Docker image with Kaniko Cache on Google Cloud Build
  # =========================================================================
  - name: 'gcr.io/kaniko-project/executor:latest'
    args:
      - --destination=gcr.io/$PROJECT_ID/luxottica-training-api:$COMMIT_SHA
      - --destination=gcr.io/$PROJECT_ID/luxottica-training-api:latest
      - --dockerfile=v2/backend/Dockerfile
      - --context=dir://v2/backend
      - --cache=true
      - --cache-ttl=48h

  # =========================================================================
  # STEP 2: Deploy container to Google Cloud Run (Serverless Scale-to-Zero)
  # =========================================================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'luxottica-training-api'
      - '--image=gcr.io/$PROJECT_ID/luxottica-training-api:$COMMIT_SHA'
      - '--region=europe-west1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--min-instances=0'
      - '--max-instances=5'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--set-env-vars=GCP_PROJECT_ID=$PROJECT_ID,BQ_DATASET_ID=luxottica_marketing_analytics'

images:
  - 'gcr.io/$PROJECT_ID/luxottica-training-api:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/luxottica-training-api:latest'

timeout: '600s'
