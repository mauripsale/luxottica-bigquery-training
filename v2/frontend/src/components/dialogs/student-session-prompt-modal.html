  <dialog id="student-session-prompt-modal" closedby="any" aria-labelledby="session-prompt-title" class="p-4 m-auto bg-transparent border-0 max-w-md w-full text-slate-900 dark:text-slate-100">
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl shadow-2xl max-w-md w-full p-6 text-slate-900 dark:text-slate-100 space-y-5 animate-in fade-in zoom-in duration-200">
      <div class="text-center space-y-2">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-600 text-white text-3xl shadow-lg">
          🕶️
        </div>
        <h2 class="text-xl font-black text-slate-900 dark:text-white" id="session-prompt-title">Bentornato!</h2>
        <p class="text-xs text-slate-500 dark:text-slate-400" id="session-prompt-subtitle">È presente una sessione studente registrata su questo browser:</p>
      </div>

      <!-- EXISTING PROFILE SUMMARY CARD -->
      <div class="p-4 bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-2xl space-y-2">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Studente:</span>
          <span id="session-card-name" class="font-extrabold text-slate-900 dark:text-white text-base">Johnny</span>
        </div>
        <div class="flex items-center justify-between text-xs">
          <span class="font-semibold text-slate-500 dark:text-slate-400">Squadra:</span>
          <span id="session-card-team" class="font-bold text-blue-600 dark:text-blue-400">🕶️ Team Oakley</span>
        </div>
        <div class="flex items-center justify-between text-xs">
          <span class="font-semibold text-slate-500 dark:text-slate-400">Punti Accumulati:</span>
          <span id="session-card-score" class="font-mono font-bold text-amber-600 dark:text-amber-400">150 pt</span>
        </div>
        <div class="flex items-center justify-between text-xs">
          <span class="font-semibold text-slate-500 dark:text-slate-400">Sfide Superate:</span>
          <span id="session-card-challenges" class="font-semibold text-emerald-600 dark:text-emerald-400">2/3 completate</span>
        </div>
      </div>

      <!-- ACTION BUTTONS -->
      <div class="space-y-2 pt-1">
        <button onclick="resumeExistingLocalSession()" id="btn-resume-existing" class="w-full py-3 px-4 rounded-xl font-bold text-sm bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white shadow-lg shadow-blue-500/25 transition cursor-pointer flex items-center justify-center space-x-2">
          <span>Continua come <span id="session-btn-name">Johnny</span> 🚀</span>
        </button>

        <div class="flex items-center space-x-2 pt-1">
          <button onclick="startAsNewStudent()" type="button" class="flex-1 py-2.5 px-3 rounded-xl font-bold text-xs bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 transition cursor-pointer text-center">
            👤 Inizia come nuovo
          </button>
          <button onclick="backToRoleSelectionFromPrompt()" type="button" class="py-2.5 px-3 rounded-xl font-bold text-xs bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-500 dark:text-slate-400 transition cursor-pointer text-center">
            ← Ruoli
          </button>
        </div>
      </div>
    </div>
  </dialog>
